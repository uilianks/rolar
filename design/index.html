<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wireframes · rolar</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" defer></script>
<script src="app.js" defer></script>
<style>
  .wrapx { max-width: 1400px; margin: 0 auto; padding: 24px 16px 60px; }
  .screens { display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); margin-top: 24px; }
  .phone { border: 1px solid var(--border); border-radius: 28px; padding: 8px; background: var(--muted); }
  .phone iframe { display: block; width: 390px; height: 760px; border: 0; border-radius: 22px; background: var(--bg); transform: scale(.72); transform-origin: 0 0; }
  .phone .clip { width: calc(390px * .72); height: calc(760px * .72); overflow: hidden; border-radius: 22px; margin: 0 auto; }
  .shot h3 { margin-top: 10px; }
  .ref { font-size: 12px; color: var(--muted-fg); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body data-page="index">
<div class="wrapx">
  <div class="toolbar">
    <a class="brand grow" href="#" style="padding:0"><span class="brand-mark">r</span>rolar · wireframes</a>
    <button class="btn btn-sm" data-theme-toggle><i data-lucide="sun-moon"></i>Tema</button>
  </div>
  <p class="muted" style="margin-top:8px;max-width:760px">HTML/CSS puro, mobile-first. Linguagem visual de referência: 21st.dev (base shadcn: neutros zinc, bordas 1px, raio 12px, claro/escuro). Abra qualquer tela em tela cheia para ver o layout de desktop (sidebar) — no celular vira dock inferior.</p>

  <div class="screens" id="screens"></div>
</div>
<script>
  const SCREENS = [
    ["landing.html", "Landing (visitante)", "Heroes, Features/Bento, Stats, Testimonials, FAQ, CTA, Footer"],
    ["entrar.html", "Entrar / criar conta", "Sign In, Sign Up (link mágico + Google)"],
    ["onboarding.html", "Onboarding (4 passos)", "Onboarding, Steppers, Radio Groups"],
    ["feed.html", "Feed", "Cards, Avatars, Badges, Tabs, Docks, Sidebars"],
    ["registrar.html", "Registrar treino", "Forms, Sliders, Selects, Toggles, Accordions"],
    ["timer.html", "Timer de rounds", "Countdown Timer, Stopwatch, Progress"],
    ["treino.html", "Detalhe do treino", "Stats & KPIs, Lists, Badges"],
    ["progresso.html", "Progresso / diário", "Calendars (heatmap), Charts & Data Viz, Progress, Dashboards"],
    ["perfil.html", "Perfil", "Profiles, Timelines (graduações)"],
    ["academia.html", "Academia", "Tables/Lists, Tabs, Notifications"],
    ["notificacoes.html", "Notificações", "Notifications, Empty States, Toasts"],
    ["config.html", "Configurações", "Toggles, Selects, Lists"],
    ["apoie.html", "Apoie (doações)", "Pricing Sections, Progress"],
  ];
  document.getElementById("screens").innerHTML = SCREENS.map(([href, title, ref]) => `
    <div class="shot">
      <div class="phone"><div class="clip"><iframe src="${href}" title="${title}" loading="lazy"></iframe></div></div>
      <div class="row between"><h3>${title}</h3><a class="btn btn-sm btn-ghost" href="${href}" target="_blank">abrir <i data-lucide="external-link"></i></a></div>
      <div class="ref">Referências 21st.dev: ${ref}</div>
    </div>`).join("");
</script>
</body>
</html>
